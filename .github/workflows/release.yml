name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.2.2"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3, got: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          arch="$(uname -m)"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "arch=$arch"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag ($arch)"

      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          port=18081
          log="${RUNNER_TEMP}/socks5.log"
          python3 ./tests/socks5_capture.py "$port" >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 50); do
            if grep -q "listening" "$log"; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "SOCKS5 test server did not start" >&2
            cat "$log" >&2
            exit 1
          fi
          AG_PROXY="socks5://127.0.0.1:${port}" \
          AG_PROXY_LOG=1 \
          DYLD_INSERT_LIBRARIES="${PWD}/build/libantigravity_proxy.dylib" \
            ./build/test_client login.example.test 443
          if ! grep -q "captured login.example.test:443" "$log"; then
            echo "SOCKS5 capture did not see the expected target" >&2
            cat "$log" >&2
            exit 1
          fi

      - name: Package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARCH: ${{ steps.meta.outputs.arch }}
        run: ./scripts/package-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCH: ${{ steps.meta.outputs.arch }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## Antigravity-Proxy ${TAG}"
            echo
            echo "macOS Builder App。不包含 Google 原版 Antigravity，需要本机已安装 \`/Applications/Antigravity.app\`。"
            echo
            echo "### 下载"
            echo
            echo "- \`Antigravity-Proxy-${VERSION}-macos-${ARCH}.dmg\`：挂载后把 App 拖到「应用程序」"
            echo "- \`Antigravity-Proxy-${VERSION}-macos-${ARCH}.zip\`：解压后得到 \`Antigravity-Proxy.app\`"
            echo "- \`SHA256SUMS.txt\`：校验上面两个文件"
            echo
            echo "首次打开若被系统拦截：右键 App，选择「打开」。App 为 ad-hoc 签名，构建架构是 \`${ARCH}\`。"
            echo
            previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [[ -n "$previous" ]]; then
              echo "### Changes since ${previous}"
              echo
              git log --pretty=format:'- %s' "${previous}..HEAD"
              echo
            fi
          } >"$notes"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$notes" \
            --target "${{ github.sha }}" \
            dist/*
